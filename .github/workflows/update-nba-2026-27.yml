name: Update NBA 2026-27 game data
on:
  workflow_dispatch:
  schedule:
    - cron: '25 11 * * *'
permissions:
  contents: write
concurrency:
  group: nba-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect completed games
        run: python scripts/update_nba.py
      - name: Commit new data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_games_2026_27.csv data/nba_update_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA completed games"
            git push
          fi
