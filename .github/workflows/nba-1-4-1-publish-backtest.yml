name: NBA 1.4.1 Publish Backtest to Website
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recalculate walk-forward backtest
        run: python scripts/nba_1_4_backtest.py
      - name: Reject empty report
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          f=Path('backtests/nba_1_4/nba_1_4_report.json')
          d=json.loads(f.read_text())
          if not d.get('tested_games',0):
              raise SystemExit('No games tested; refusing to publish empty report')
          print('Validated games:',d['tested_games'])
          PYCODE
      - name: Commit public dashboard report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/nba_1_4/nba_1_4_report.json backtests/nba_1_4/nba_1_4_backtest_rows.csv
          if git diff --cached --quiet; then
            echo 'Report unchanged'
          else
            git commit -m 'Update NBA backtest dashboard data'
            git push origin HEAD:main
          fi
