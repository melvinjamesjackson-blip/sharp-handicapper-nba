name: NBA 1.5B Calibration Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run NBA 1.5B chronological calibration
        run: python scripts/nba_1_5b_calibration.py
      - name: Upload NBA 1.5B report
        uses: actions/upload-artifact@v4
        with:
          name: nba-1-5b-calibration-report
          path: backtests/nba_1_5b/
          if-no-files-found: error
